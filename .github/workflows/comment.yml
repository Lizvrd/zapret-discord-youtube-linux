name: Auto comment on new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            # Пожалуйста, ознакомьтесь с README. В нём есть ответы на частые вопросы и описания файлов: [README.md](https://github.com/Lizvrd/zapret-discord-youtube-linux/blob/main/README.md)

            ### Прежде всего
            - Убедитесь, что `nfqws` установлен: `./zapret.sh --install-nfqws`
            - Проверьте окружение: `sudo ./zapret.sh check general` (root, firewall-модули, параметры `nfqws`)
            - Посмотрите лог: `/var/log/zapret-linux.log`
            - Не работает / перестала работать стратегия — попробуйте другие: `./zapret.sh list`, `sudo ./zapret.sh start alt`
            - На NFQUEUE `200` может работать только один экземпляр zapret: остановите лишние (`sudo ./zapret.sh stop`)

            ##
            ### Проблемы с запуском?
            - Нужны права root: `sudo ./general.sh`
            - Нужен `iptables` **или** `nftables`, а также `curl`
            - Проверьте параметры без запуска: `./general.sh --dry-run`
            - Если `nfqws` падает с `file_open_test: Permission denied` — запустите `sudo NFQWS_UID=0:0 ./general.sh`
            - Служба не стартует после переноса каталога — переустановите её: `sudo ./service.sh install <стратегия>`

            ##
            ### Не работает игра / сервис / сайт?
            - Проверьте работоспособность без обхода:
                - **Работает:**
                    - Домен можно удалить в `lists/list-general-user.txt`, если он там присутствует
                    Либо добавить домен в `lists/list-exclude-user.txt` (*поддомены учитываются автоматически*)
                    - Выключите Game Filter: удалите `utils/game_filter.enabled` или поставьте в нём `mode=disabled`, и уберите лишние IP из `lists/ipset-all.txt` (заглушка `203.0.113.113/32` = фильтр выключен)
                - **Не работает: пробуйте другие стратегии.** Если не помогло:
                *Если это сайт* — добавьте домен в `lists/list-general-user.txt` (поддомены учитываются автоматически).
                *Если это игра* — включите Game Filter (создайте `utils/game_filter.enabled` с `mode=all`) и/или добавьте IP в `lists/ipset-all.txt` (после правки перезапустите обход).

                    **Пробуйте разные стратегии после внесения изменений, если это не сработало**

            - Если проблема связана с игрой и решения выше не помогли, то:
                    1. **Закройте** этот issue.
                    2. **Создайте новую (или найдите уже существующую) ветку обсуждений** в разделе [**Discussions**](https://github.com/Lizvrd/zapret-discord-youtube-linux/discussions), подробно опишите проблему и ждите помощи.

            # Пожалуйста, сообщите следующую информацию, чтобы Вам помогли быстрее:
            - дистрибутив и версия ядра: `cat /etc/os-release; uname -r`
            - какой firewall используется: `iptables -V` и/или `nft -v`
            - вывод диагностики: `sudo ./zapret.sh check <стратегия>`
            - результаты автопрогона: файл из `utils/test results/` (создаётся `sudo ./zapret-test.sh`)
            - полный лог `/var/log/zapret-linux.log`
            - состояние Game Filter (`utils/game_filter.enabled`) и применённый ipset (`lists/ipset-all.txt`)
